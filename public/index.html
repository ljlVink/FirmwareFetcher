<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>FirmwareFetcher</title>
  <script>
    (function () {
      var theme = "dark";
      try { theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#records-panel" data-i18n="skipLink">Skip to firmware records</a>
  <header class="site-header shell">
    <span class="brand">FirmwareFetcher</span>
    <nav aria-label="Site navigation" data-i18n-aria-label="siteNav">
      <a class="header-link" href="https://github.com/ljlVink/haucet/releases" target="_blank" rel="noopener noreferrer" data-i18n="haucet">Haucet</a>
      <a class="header-link" href="https://github.com/ljlVink/Pedal" target="_blank" rel="noopener noreferrer">Pedal(Beta)</a>
    </nav>
    <div class="header-actions">
      <a class="icon-button" href="https://github.com/ljlvink/FirmwareFetcher" target="_blank" rel="noopener noreferrer" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        <span class="visually-hidden">GitHub</span>
      </a>
      <a class="icon-button" href="https://t.me/firmwarefetcher" target="_blank" rel="noopener noreferrer" title="Telegram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        <span class="visually-hidden">Telegram</span>
      </a>
      <label class="lang-select" for="lang-select" title="Language" data-i18n-title="language">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.87,15.07L10.33,12.56L10.36,12.53C12.1,10.59 13.34,8.36 14.07,6H17V4H10V2H8V4H1V6H12.17C11.5,7.92 10.44,9.75 9,11.35C8.07,10.32 7.3,9.19 6.69,8H4.69C5.42,9.63 6.42,11.17 7.67,12.56L2.58,17.58L4,19L9,14L12.11,17.11L12.87,15.07M18.5,10H16.5L12,22H14L15.12,19H19.87L21,22H23L18.5,10M15.88,17L17.5,12.67L19.12,17H15.88Z"/></svg>
        <span class="visually-hidden" data-i18n="language">Language</span>
        <select id="lang-select" autocomplete="off">
          <option value="en" lang="en">English</option>
          <option value="zh" lang="zh-CN">中文</option>
          <option value="ru" lang="ru">Русский</option>
        </select>
      </label>
      <button id="theme-toggle" class="icon-button" type="button" aria-pressed="true" title="Toggle dark / light" data-i18n-title="themeToggleTitle">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span class="visually-hidden" data-i18n="themeToggleLabel">Toggle dark mode</span>
      </button>
    </div>
  </header>

  <main class="shell">
    <section class="panel submission-panel" id="submit-panel" aria-labelledby="submit-title">
      <div class="section-heading">
        <div>
          <h2 id="submit-title" data-i18n="submitTitle">Submit a new version</h2>
        </div>
        <label class="brand-select" for="brand">
          <span class="visually-hidden" data-i18n="brandLabel">Firmware brand</span>
          <select id="brand" name="brand" form="submit-form" autocomplete="off">
            <option value="huawei" selected data-i18n="huawei">Huawei</option>
            <option value="honor" data-i18n="honor">Honor</option>
          </select>
        </label>
      </div>
      <details class="submission-method" id="version-method" open>
        <summary data-i18n="byVersion">Submit by version</summary>
        <form id="submit-form" class="submission-form">
          <div class="form-grid">
            <label class="field parse-field" for="auto-parse">
              <input id="auto-parse" type="text" placeholder="HOP-AL10-LGRP3 207.0.0.109(SP6C00E105R4P4patch00)" autocomplete="off" spellcheck="false">
            </label>
            <label class="field" for="dev"><span data-i18n="deviceModel">Device model</span>
              <input id="dev" type="text" name="dev" required maxlength="64" placeholder="HOP-AL10" spellcheck="false" autocomplete="off">
            </label>
            <label class="field" for="patch"><span data-i18n="patchVersion">Patch version</span>
              <span class="patch-row">
                <input id="patch" type="text" name="patch" value="patch00" maxlength="32" placeholder="patch00" spellcheck="false" autocomplete="off">
                <input id="patch-enabled" type="checkbox" checked aria-label="Include patch version" title="Checked: include the patch version; unchecked: query without patch" data-i18n-aria-label="patchEnabledLabel" data-i18n-title="patchEnabledTitle">
              </span>
            </label>
            <label class="field" for="vendor"><span data-i18n="vendor">Channel / region</span>
              <input id="vendor" type="text" name="vendor" value="all_cn" maxlength="32" placeholder="all_cn" spellcheck="false" autocomplete="off">
            </label>
            <label class="field" for="base"><span data-i18n="baseVersion">Base system version</span>
              <input id="base" type="text" name="base" required maxlength="160" placeholder="HOP-LGRP3-CHN 207.0.0.109(SP6)" spellcheck="false" autocomplete="off">
            </label>
            <label class="field" for="cust"><span data-i18n="custVersion">CUST version</span>
              <input id="cust" type="text" name="cust" required maxlength="160" placeholder="HOP-AL10-CUST 207.0.0.105(C00)" spellcheck="false" autocomplete="off">
            </label>
            <label class="field" for="preload"><span data-i18n="preloadVersion">PRELOAD version</span>
              <input id="preload" type="text" name="preload" required maxlength="160" placeholder="HOP-AL10-PRELOAD 207.0.0.4(C00R4)" spellcheck="false" autocomplete="off">
            </label>
          </div>
          <div class="form-footer">
            <fieldset class="package-choice">
              <legend data-i18n="packageType">Package type</legend>
              <div class="segmented-control">
                <label class="choice"><input type="radio" name="upgrade_or_erec" value="upgrade" required><span data-i18n="upgrade">Incremental</span></label>
                <label class="choice"><input type="radio" name="upgrade_or_erec" value="recovery" checked><span data-i18n="recovery">Full</span></label>
                <label class="choice"><input type="radio" name="upgrade_or_erec" value="rollback"><span data-i18n="rollback">Rollback (Beta)</span></label>
              </div>
            </fieldset>
            <div class="submit-action">
              <button class="button button-primary" type="submit" id="submit-btn" data-i18n="submit">Submit</button>
            </div>
          </div>
        </form>
      </details>
      <details class="submission-method" id="manual-method">
        <summary data-i18n="manualTitle">Submit three packages manually</summary>
        <form id="manual-submit-form" class="submission-form manual-form">
          <label class="field" for="manual-urls">
            <span data-i18n="manualUrls">Firmware package URLs (one per line)</span>
            <textarea id="manual-urls" name="urls" rows="6" required placeholder="Paste one full ZIP URL per line" data-i18n-placeholder="manualPlaceholder" autocomplete="off" spellcheck="false"></textarea>
          </label>
          <div class="form-footer">
            <div class="submit-action">
              <button class="button button-primary" type="submit" id="manual-submit-btn" data-i18n="submit">Submit</button>
            </div>
          </div>
        </form>
      </details>
    </section>

    <p id="msg" class="notice" role="status" aria-live="polite" hidden></p>

    <section class="panel records-panel" id="records-panel" aria-labelledby="records-title">
      <div class="section-heading">
        <div class="records-heading">
          <h2 id="records-title" data-i18n="recordsTitle">Firmware list</h2>
          <span id="total-count" class="count-badge" aria-label="Saved records" data-i18n-aria-label="totalCountLabel">-</span>
        </div>
        <label class="emulator-toggle" for="show-emulators">
          <input id="show-emulators" type="checkbox" autocomplete="off">
          <span data-i18n="showEmulators">Show emulator packages</span>
        </label>
      </div>
      <div class="filter-bar" role="search" aria-label="Filter firmware records" data-i18n-aria-label="filterLabel">
        <label class="filter-field search-field" for="search">
          <input id="search" type="search" aria-label="Search records" placeholder="Model, version, channel…" data-i18n-aria-label="searchLabel" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
        </label>
        <label class="filter-field" for="action-filter">
          <select id="action-filter" aria-label="Package type" data-i18n-aria-label="packageType"><option value="" data-i18n="allTypes">All types</option><option value="upgrade" data-i18n="upgrade">Incremental</option><option value="recovery" data-i18n="recovery">Full</option><option value="rollback" data-i18n="rollback">Rollback (Beta)</option></select>
        </label>
      </div>
      <div class="table-wrap" id="record-list" aria-busy="true">
        <table class="records-table">
          <thead><tr><th scope="col" data-i18n="colDevice">Device</th><th scope="col">VENDOR</th><th scope="col" data-i18n="colVersion">Firmware version</th><th scope="col" data-i18n="packageType">Package type</th><th scope="col" data-i18n="colDetails">Details</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty-state"><span class="loading-mark" aria-hidden="true"></span><span data-i18n="loading">Loading saved firmware…</span></td></tr></tbody>
        </table>
      </div>
      <nav id="pagination" class="pagination" aria-label="Firmware record pages" data-i18n-aria-label="paginationLabel" hidden></nav>
    </section>

    <noscript><p class="notice notice-error">This page needs JavaScript to load firmware and submit versions. You can also use the <a href="/requests">JSON API</a> directly.</p></noscript>
  </main>
</body>
</html>
