[package]
name = "firmwarefetcher"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["queue"] }
worker-macros = { version = "0.8" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
miniz_oxide = { version = "0.8", default-features = false }
crc32fast = { version = "1", default-features = false }
quick-xml = "0.37"
sha2 = "0.10"
